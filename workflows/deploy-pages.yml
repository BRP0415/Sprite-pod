name: Deploy to GitHub Pages

# Builds the static (no-backend) version of Sprite Pod and publishes it to
# GitHub Pages. Progress is stored per browser in this mode — see README.md
# if you want real cross-device accounts.

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Called by refresh-roster.yml. A push made by a workflow using GITHUB_TOKEN
  # does not start other workflows, so the roster job invokes this one directly
  # instead of relying on its own commit to trigger a deploy.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        # VITE_API_BASE is optional. Set it as a repository variable to point
        # this Pages build at a hosted backend and get real accounts back.
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: |
          if [ -n "$VITE_API_BASE" ]; then
            npx vite build
          else
            npm run build:static
          fi

      - name: Add SPA 404 fallback
        run: cp dist/public/index.html dist/public/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
